name: Vesper Discord Greeter
on:
  schedule:
    # run once an hour during the daytime（UTC 12-02 ≈ EST 8am-10pm）
    - cron: '0 12-23,0-2 * * *'
  workflow_dispatch:
jobs:
  greet:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Maybe send greeting
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "Testing API call..."

          curl -v https://api.anthropic.com/v1/messages \
            -H "x-api-key: $ANTHROPIC_API_KEY" \
            -H "content-type: application/json" \
            -H "anthropic-version: 2023-06-01" \
            -d '{"model": "claude-haiku-4-5-20251001", "max_tokens": 60, "messages": [{"role": "user", "content": "Say hi"}]}'